openapi: "3.1.0"
info:
  title: Oshap API
  version: "1.0.0"
  description: |
    QR-based table ordering and payment API for restaurants.

    Admin endpoints require a staff JWT sent as `Authorization: Bearer`,
    obtained from `POST /auth/login` and refreshed at `POST /auth/refresh`.
    Platform endpoints require `x-platform-token`. Customer endpoints are
    public (no auth).

    ## Money

    **Every money field is an integer number of kobo** (1 naira = 100 kobo), so
    `price: 250000` means ₦2,500. No floats appear anywhere in the money path;
    VAT and service charge are integer basis points (`750` = 7.5%) applied with
    half-up rounding, so order totals reconcile exactly.

    Applies to `price`, `total`, `subtotal`, `vat`, `discount`, `tip`,
    `service_charge`, `cost_per_unit`, `price_delta` and `amount`.

    ## Response envelope

    **Every response is wrapped.** The backend returns all payloads through a
    common envelope:

    ```json
    { "success": true, "message": "OK", "code": 200, "data": <payload> }
    ```

    The schemas declared per path below describe the **`data` member**, not the
    whole body — repeating the wrapper on every operation would bury the part
    that actually differs. See the `Envelope` schema for the wrapper itself.

    Clients are expected to unwrap. The shared TypeScript client does this
    centrally in `packages/shared/src/api/client.ts`, so callers stay typed
    against the inner payload.

    Errors use the same envelope with `success: false` and a human-readable
    `message`; the HTTP status is authoritative.

servers:
  - url: http://localhost:8000/api/v1
    description: Local FastAPI dev server

tags:
  - name: Menu
    description: Public menu browsing
  - name: Tables
    description: Table lookup by QR code
  - name: Orders
    description: Order creation and retrieval
  - name: Sessions
    description: Group ordering sessions
  - name: Payments
    description: Payment claims and confirmation
  - name: Admin
    description: Merchant dashboard (kitchen, history, menu mgmt, table mgmt)
  - name: Inventory
    description: Stock tracking and low-stock alerts
  - name: Group
    description: Multi-branch group overview and analytics
  - name: Platform
    description: Internal operator portal (tenant onboarding, subscriptions, health)
  - name: Devices
    description: FCM push notification registration
  - name: Events
    description: Server-Sent Events stream

# =========================================================================
# Security
# =========================================================================
security: []   # public by default; admin endpoints add adminPin per-operation

components:
  securitySchemes:
    adminPin:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Staff access token from `POST /auth/login`, sent as
        `Authorization: Bearer <access_token>`. Valid for 15 minutes; exchange
        the refresh token at `POST /auth/refresh` when it expires. Role and
        permissions are resolved server-side per request, not carried in the
        token. (The scheme key is still `adminPin` for historical reasons — the
        PIN header it replaced is gone.)
    platformToken:
      type: apiKey
      in: header
      name: x-platform-token
      description: >
        Internal operator credential for the platform portal. Set via the
        `PLATFORM_TOKEN` environment variable on the backend. Required by all
        `/platform/*` endpoints.

  # -----------------------------------------------------------------------
  # Reusable parameters
  # -----------------------------------------------------------------------
  parameters:
    BranchId:
      name: branch_id
      in: query
      required: false
      schema: { type: string, format: uuid }
      description: >
        Scope the response to a single branch of a multi-branch group. Sent by
        the admin app when an OWNER selects a branch from the branch switcher.
        Omitted = the owner's default scope (all branches / home branch).

  # -----------------------------------------------------------------------
  # Schemas
  # -----------------------------------------------------------------------
  schemas:
    NotificationType:
      type: string
      description: >
        The six SSE events that ask a person to do something. Deliberately a
        subset of the event vocabulary — see the `/events` description.
      enum:
        - waiter_called
        - pos_requested
        - new_order
        - order_ready
        - payment_claimed
        - low_stock
    Notification:
      type: object
      description: >
        Facts, not sentences. The client composes the wording, because the same
        record drives a row in the notifications tab and a toast in the alert
        centre and those must not drift. FCM push payloads are the exception —
        no client is running to compose those.
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/NotificationType" }
        branch_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The venue this happened at. A notification belongs to a branch, not a
            group: a manager at one venue must never be paged for another&#39;s
            tables, and "Table 4 needs attention" is meaningless across two
            buildings that both have a table 4.


            Null only for single-location restaurants that predate branches.
        branch_name: { type: string, nullable: true }
        table_id: { type: string, format: uuid, nullable: true }
        table_name:
          type: string
          nullable: true
          description: >
            Resolved when the row is written, never looked up by the client. The
            SSE payload carries only the uuid, so the live alert already degrades
            to "a table" when the table cache is cold; a row read three hours
            later must not depend on what a browser happened to have cached.
        order_id: { type: string, format: uuid, nullable: true }
        order_reference: { type: string, nullable: true }
        amount:
          type: integer
          nullable: true
          description: Kobo, like every other money field.
        menu_item_id: { type: string, format: uuid, nullable: true }
        menu_item_name: { type: string, nullable: true, description: "`low_stock` only." }
        created_at: { type: string, format: date-time }
        read:
          type: boolean
          description: For the calling staff member only.
        resolved_at: { type: string, format: date-time, nullable: true }
        resolved_by_name:
          type: string
          nullable: true
          description: Who claimed it, so a colleague knows not to go.
      required: [id, type, created_at, read]
    Envelope:
      type: object
      description: >
        The wrapper applied to every response. Per-path schemas describe the
        `data` member. Documented once here rather than repeated across every
        operation.
      properties:
        success: { type: boolean }
        message: { type: string, example: "OK" }
        code: { type: integer, example: 200 }
        data:
          description: The payload described by the operation's own schema.
      required: [success, message, code, data]

    BankAccount:
      type: object
      description: >
        A restaurant payout account. Restaurants hold several because transfers
        to any one bank fail often enough to be a single point of failure.
        `is_default` is exclusive — setting it unsets every other account.
        `is_active` is independent: an inactive account is simply not offered.
      properties:
        id: { type: string, format: uuid }
        bank_name: { type: string }
        account_number: { type: string }
        account_name: { type: string }
        is_active: { type: boolean }
        is_default: { type: boolean }
        success_count:
          type: integer
          description: Verified payments into this account. Feeds the ranking.
        failure_count:
          type: integer
          description: Rejected payments claimed against it. Feeds the ranking.
      required: [id, bank_name, account_number, account_name, is_active, is_default]

    BankAccountRequest:
      type: object
      properties:
        bank_name: { type: string }
        account_number: { type: string }
        account_name: { type: string }
        is_active: { type: boolean }
        is_default:
          type: boolean
          description: Exclusive — setting it true unsets the default on every other account.
      required: [bank_name, account_number, account_name]

    Restaurant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        address:
          type: string
          nullable: true
          description: >
            Street address. Shown to guests in the customer app header as
            "You're sitting at …", so it should read as a place a person
            recognises rather than a postal-formatted line.
        operating_hours: { type: string, nullable: true }
        whatsapp_number: { type: string, nullable: true }
        vat_rate:
          type: integer
          description: >
            Integer basis points, not a percentage — `750` = 7.5%. Integers for
            the same reason money is: a float would reintroduce drift into VAT.
          example: 750
        service_charge_rate: { type: integer, example: 500 }
      required: [id, name]

    AdminUpdateSettingsRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        address: { type: string, nullable: true }
        operating_hours: { type: string, nullable: true }
        bank_name: { type: string, nullable: true }
        account_number: { type: string, nullable: true }
        account_name: { type: string, nullable: true }
        whatsapp_number: { type: string, nullable: true }
        vat_rate:
          type: integer
          minimum: 0
          maximum: 10000
          description: >
            Integer basis points, not percent - 750 is 7.5%. Omit to leave the
            existing rate unchanged. A restaurant with no rate set charges no
            VAT at all, silently.
        service_charge_rate:
          type: integer
          minimum: 0
          maximum: 10000
          description: Integer basis points, as above.

    MenuItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        restaurant_id: { type: string, format: uuid }
        name: { type: string }
        price: { type: integer, description: Price in kobo (1 naira = 100 kobo). }
        category: { type: string }
        description: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        available: { type: boolean }
        sort_order: { type: integer }
        stock_count:
          type: integer
          nullable: true
          description: Remaining stock. `null` = inventory tracking disabled for this item.
        low_stock_threshold:
          type: integer
          description: Stock level at or below which a low-stock alert fires.
        modifier_groups:
          type: array
          description: >
            Option groups attached to this dish, returned inline so the customer
            app needs no second call. Absent or empty means the dish is ordered
            as-is.
          items:
            $ref: "#/components/schemas/ModifierGroup"
      required: [id, restaurant_id, name, price, category, available, sort_order, low_stock_threshold]

    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: integer }
        price:
          type: integer
          description: >
            Per-unit price in kobo, INCLUDING every chosen modifier's delta.
            Note the asymmetry with CreateOrderRequest, where the same field
            carries the base price and the server adds the deltas.
        notes: { type: string, nullable: true }
        modifiers:
          type: array
          nullable: true
          description: >
            Chosen options, denormalized at order time so renaming a modifier
            later cannot rewrite a ticket already printed.
          items:
            $ref: "#/components/schemas/OrderItemModifier"
      required: [id, name, quantity, price]

    OrderItemModifier:
      type: object
      properties:
        name: { type: string, description: The group's name, e.g. "Protein". }
        option: { type: string, description: The chosen option's name, e.g. "Turkey". }
        price_delta: { type: integer, description: Amount added in kobo; may be negative. }
      required: [name, option, price_delta]

    ModifierOption:
      type: object
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        name: { type: string }
        price_delta:
          type: integer
          description: >
            Added to the dish's base price, in kobo. May be zero (a choice that
            costs nothing) or negative (a smaller portion).
        sort_order: { type: integer }
        available: { type: boolean }
      required: [id, group_id, name, price_delta, sort_order, available]

    ModifierGroup:
      type: object
      description: >
        A reusable set of choices owned by the restaurant, not by a dish. One
        group can be attached to many menu items, so editing an option updates
        every dish that uses it.
      properties:
        id: { type: string, format: uuid }
        restaurant_id: { type: string, format: uuid }
        name: { type: string }
        required: { type: boolean, description: Whether the guest must choose at least `min`. }
        min: { type: integer }
        max: { type: integer, description: "`1` behaves as a radio group; higher allows multi-select." }
        sort_order: { type: integer }
        options:
          type: array
          items:
            $ref: "#/components/schemas/ModifierOption"
      required: [id, restaurant_id, name, required, min, max, sort_order, options]

    CreateModifierGroupRequest:
      type: object
      properties:
        name: { type: string }
        required: { type: boolean, default: false }
        min: { type: integer, default: 0 }
        max: { type: integer, default: 1 }
        options:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              price_delta: { type: integer, default: 0 }
            required: [name]
      required: [name]

    UpdateModifierGroupRequest:
      type: object
      properties:
        name: { type: string }
        required: { type: boolean }
        min: { type: integer }
        max: { type: integer }
        sort_order: { type: integer }

    CreateModifierOptionRequest:
      type: object
      properties:
        name: { type: string }
        price_delta: { type: integer, default: 0 }
      required: [name]

    UpdateModifierOptionRequest:
      type: object
      properties:
        name: { type: string }
        price_delta: { type: integer }
        available: { type: boolean }
        sort_order: { type: integer }

    SetupVerifyRequest:
      type: object
      properties:
        token: { type: string }
      required: [token]

    SetupVerifyResponse:
      type: object
      properties:
        restaurant_name: { type: string }
        owner_name: { type: string }
        phone_hint:
          type: string
          description: Masked to the last few digits, e.g. "**** 4567".
        email_hint: { type: string, nullable: true }
      required: [restaurant_name, owner_name, phone_hint]

    SetupCompleteRequest:
      type: object
      properties:
        token: { type: string }
        password: { type: string, minLength: 10 }
      required: [token, password]

    ForgotPasswordRequest:
      type: object
      properties:
        identifier:
          type: string
          description: Phone or email; the server resolves which by shape.
      required: [identifier]

    Ingredient:
      type: object
      description: >
        Stock one level below a menu item: what dishes are made of. Quantities
        are fractional (2.5 kg of rice), unlike the integer plate counts on
        MenuItem.stock_count.
      properties:
        id: { type: string, format: uuid }
        restaurant_id: { type: string, format: uuid }
        name: { type: string }
        unit: { type: string, description: Free text in the merchant own vocabulary - kg, L, tin. }
        stock_qty: { type: number, format: float }
        low_stock_threshold: { type: number, format: float, nullable: true }
        cost_per_unit: { type: integer, nullable: true, description: Cost of one unit in kobo. }
        supplier_id: { type: string, format: uuid, nullable: true }
        par_level: { type: number, format: float, nullable: true, description: Target level to reorder back up to. }
      required: [id, restaurant_id, name, unit, stock_qty]

    CreateIngredientRequest:
      type: object
      properties:
        name: { type: string }
        unit: { type: string, default: unit }
        stock_qty: { type: number, format: float, default: 0 }
        low_stock_threshold: { type: number, format: float, nullable: true }
        cost_per_unit: { type: integer, nullable: true }
        par_level: { type: number, format: float, nullable: true }
      required: [name]

    UpdateIngredientRequest:
      type: object
      description: Note that stock_qty is absent - levels move through /adjust only.
      properties:
        name: { type: string }
        unit: { type: string }
        low_stock_threshold: { type: number, format: float, nullable: true }
        cost_per_unit: { type: integer, nullable: true }
        par_level: { type: number, format: float, nullable: true }

    AdjustStockRequest:
      type: object
      properties:
        delta: { type: number, format: float, description: Signed - negative removes. }
        reason:
          type: string
          description: >
            PURCHASE, WASTAGE, STOCK_TAKE or CORRECTION from staff. SALE is
            written by the server when an order depletes a recipe.
        note: { type: string, nullable: true }
      required: [delta, reason]

    StockMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        ingredient_id: { type: string, format: uuid }
        delta: { type: number, format: float }
        reason: { type: string }
        actor_id: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }
        order_id:
          type: string
          format: uuid
          nullable: true
          description: Present when the movement came from an order rather than a person.
        created_at: { type: string, format: date-time }
      required: [id, ingredient_id, delta, reason, created_at]

    StockMovementsResponse:
      type: object
      properties:
        movements:
          type: array
          items:
            $ref: "#/components/schemas/StockMovement"
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
      required: [movements, total, page, per_page]

    RecipeLine:
      type: object
      properties:
        ingredient_id: { type: string, format: uuid }
        ingredient_name: { type: string }
        unit: { type: string }
        qty_per_serving: { type: number, format: float }
      required: [ingredient_id, ingredient_name, unit, qty_per_serving]

    RecipeResponse:
      type: object
      properties:
        menu_item_id: { type: string, format: uuid }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/RecipeLine"
      required: [menu_item_id, lines]

    SetRecipeRequest:
      type: object
      description: Replaces the whole recipe for the dish - send every line to keep.
      properties:
        lines:
          type: array
          items:
            type: object
            properties:
              ingredient_id: { type: string, format: uuid }
              qty_per_serving: { type: number, format: float, default: 1 }
            required: [ingredient_id]
      required: [lines]

    SetMenuItemModifierGroupsRequest:
      type: object
      description: Replaces the item's entire attachment set — send every id to keep.
      properties:
        group_ids:
          type: array
          items: { type: string, format: uuid }
      required: [group_ids]

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        table_id: { type: string }
        restaurant_id: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/OrderStatus"
        subtotal: { type: integer, description: Sum of line totals, in kobo. }
        discount: { type: integer }
        service_charge: { type: integer }
        vat: { type: integer }
        tip: { type: integer }
        total:
          type: integer
          description: >
            Exactly `subtotal - discount + service_charge + vat + tip`, in
            integer kobo — no rounding slack.
        reference: { type: string }
        session_id: { type: string, format: uuid, nullable: true }
        customer_name: { type: string, nullable: true }
        device_token: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, table_id, restaurant_id, status, total, reference, created_at]

    OrderWithItems:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            order_items:
              type: array
              items:
                $ref: "#/components/schemas/OrderItem"

    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        amount: { type: integer }
        status:
          $ref: "#/components/schemas/PaymentStatus"
        proof_url: { type: string, nullable: true }
        method:
          type: string
          enum: [CASH, MANUAL_TRANSFER, POS]
          description: >
            How the money arrived. Previously inferred client-side from a flag on
            the customer's phone, so the server could not distinguish transfer
            from POS — which made reconciliation and analytics wrong.
        created_at: { type: string, format: date-time }
      required: [id, order_id, amount, status, created_at]

    TableSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        table_id: { type: string }
        pin: { type: string }
        status:
          $ref: "#/components/schemas/SessionStatus"
        created_at: { type: string, format: date-time }
      required: [id, table_id, pin, status, created_at]

    ActiveOrderBundle:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            combined_order_ids:
              type: array
              items: { type: string, format: uuid }

    TableInfo:
      type: object
      properties:
        bank_accounts:
          type: array
          description: >
            Active accounts, already ranked — default first, then by success
            rate. The pay screen shows `[0]` and offers the rest as fallbacks.
            Empty means the restaurant takes POS/cash only.
          items: { $ref: "#/components/schemas/BankAccount" }
        table_id: { type: string }
        status:
          $ref: "#/components/schemas/TableStatus"
        restaurant:
          $ref: "#/components/schemas/Restaurant"
        unpaid_order:
          oneOf:
            - $ref: "#/components/schemas/ActiveOrderBundle"
            - type: "null"
        pending_payments:
          oneOf:
            - $ref: "#/components/schemas/ActiveOrderBundle"
            - type: "null"
      required: [table_id, status, restaurant]

    OrderDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        table:
          type: string
          description: >
            The table's NAME ("T1"), not its uuid. Note the asymmetry with
            `GET /table/{table_id}`, which takes the uuid: path params identify
            the table, body fields record the label the order is filed under.
            Sending a uuid here returns 404.
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        total: { type: integer }
        status: { $ref: "#/components/schemas/OrderStatus" }
        reference: { type: string }
        payment:
          oneOf:
            - $ref: "#/components/schemas/Payment"
            - type: "null"
        created_at: { type: string, format: date-time }
      required: [id, table, items, total, status, reference, created_at]

    AdminTableStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: >
            The table's globally unique id. This is what `GET /table/{table_id}`
            resolves and what a QR code encodes — table *names* repeat across
            restaurants, so a name alone identifies nothing.
        table_id:
          type: string
          description: The name staff read ("T1"). Unique only within a restaurant.
        status: { $ref: "#/components/schemas/TableStatus" }
        unpaidTotal: { type: integer }
        pendingTotal: { type: integer }
        hasPending: { type: boolean }
        hasUnpaid: { type: boolean }
      required: [id, status, unpaidTotal, pendingTotal, hasPending, hasUnpaid]

    AdminHistoryOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            order_items:
              type: array
              items: { $ref: "#/components/schemas/OrderItem" }
            payments:
              type: array
              items: { $ref: "#/components/schemas/Payment" }

    # ---- Enums ----
    OrderStatus:
      type: string
      enum:
        [CREATED, PREPARING, READY, PAYMENT_PENDING, CONFIRMED, CANCELLED, REFUNDED]

    PaymentStatus:
      type: string
      enum: [NOT_PAID, CLAIMED, CONFIRMED, VERIFIED, FAILED, REFUNDED]

    TableStatus:
      type: string
      enum: [OPEN, CLOSED]

    SessionStatus:
      type: string
      enum: [ACTIVE, CLOSED]

    CloseReason:
      type: string
      enum: [paid, abandoned]

    # ---- Request / Response payloads ----
    CreateOrderRequest:
      type: object
      properties:
        table:
          type: string
          description: >
            The table's NAME ("T1"), not its uuid. Note the asymmetry with
            `GET /table/{table_id}`, which takes the uuid: path params identify
            the table, body fields record the label the order is filed under.
            Sending a uuid here returns 404.
        restaurant_id: { type: string, format: uuid }
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              qty: { type: integer }
              price:
                type: integer
                description: >
                  The dish's BASE price in kobo, WITHOUT modifier deltas. The
                  server computes `line_price = price + sum(option.price_delta)`,
                  so sending an already-adjusted price double-counts every
                  modifier. The Order returned carries the resolved figure.
              menu_item_id: { type: string, format: uuid }
              notes: { type: string }
              modifiers:
                type: array
                description: Chosen options by id; the server resolves name and price.
                items:
                  type: object
                  properties:
                    option_id: { type: string, format: uuid }
                  required: [option_id]
            required: [name, qty, price]
        session_id: { type: string, format: uuid }
        customer_name: { type: string }
        device_token: { type: string }
      required: [table, restaurant_id, items]

    CreateOrderResponse:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        order_id: { type: string, format: uuid }
        reference: { type: string }
        total: { type: integer }

    ClaimPaymentRequest:
      type: object
      properties:
        order_id: { type: string, format: uuid }
        combined_order_ids:
          type: array
          items: { type: string, format: uuid }
        proof_url: { type: string }
      # at least one of order_id or combined_order_ids required

    ClaimPaymentResponse:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        processed: { type: integer }

    ConfirmOrdersRequest:
      type: object
      properties:
        order_ids:
          type: array
          items: { type: string, format: uuid }
      required: [order_ids]

    ConfirmOrdersResponse:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        confirmed: { type: integer }

    SessionStartRequest:
      type: object
      properties:
        tableId:
          type: string
          description: >
            The table's NAME, not its uuid — see the note on
            `CreateOrderRequest.table`. A uuid here returns 404.
        action: { type: string, enum: [START] }
        customer_name: { type: string }
        unclaimed_order_ids:
          type: array
          items: { type: string, format: uuid }
      required: [tableId, action]

    SessionJoinRequest:
      type: object
      properties:
        tableId:
          type: string
          description: >
            The table's NAME, not its uuid — see the note on
            `CreateOrderRequest.table`. A uuid here returns 404.
        action: { type: string, enum: [JOIN] }
        pin: { type: string }
        customer_name: { type: string }
        unclaimed_order_ids:
          type: array
          items: { type: string, format: uuid }
      required: [tableId, action, pin]

    SessionResponse:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        session:
          $ref: "#/components/schemas/TableSession"

    SessionOrdersResponse:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        orders:
          type: array
          items: { $ref: "#/components/schemas/OrderWithItems" }

    CreateMenuItemRequest:
      type: object
      properties:
        name: { type: string }
        price: { type: integer }
        category: { type: string }
        description: { type: string }
        image_url: { type: string }
      required: [name, price, category]

    UpdateMenuItemRequest:
      type: object
      properties:
        name: { type: string }
        price: { type: integer }
        category: { type: string }
        description: { type: string }
        image_url: { type: string }
        sort_order: { type: integer }

    KitchenUpdateRequest:
      type: object
      properties:
        order_id: { type: string, format: uuid }
        status: { type: string, enum: [PREPARING, READY] }
      required: [order_id, status]

    AdminVerifyRequest:
      type: object
      properties:
        table_id: { type: string }
      required: [table_id]

    AdminVerifyResponse:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        verified_count: { type: integer }
        auto_closed: { type: boolean }

    AdminCloseRequest:
      type: object
      properties:
        table_id: { type: string }
        reason: { $ref: "#/components/schemas/CloseReason" }
      required: [table_id, reason]

    AdminCloseResponse:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        table_id: { type: string }
        reason: { $ref: "#/components/schemas/CloseReason" }

    AdminTablesResponse:
      type: object
      properties:
        tables:
          type: array
          items: { $ref: "#/components/schemas/AdminTableStatus" }

    AdminHistoryPagination:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    AdminHistorySummary:
      type: object
      properties:
        confirmed_count: { type: integer }
        cancelled_count: { type: integer }
        page_revenue: { type: integer }

    AdminHistoryResponse:
      type: object
      properties:
        orders:
          type: array
          items: { $ref: "#/components/schemas/AdminHistoryOrder" }
        pagination:
          $ref: "#/components/schemas/AdminHistoryPagination"
        summary:
          $ref: "#/components/schemas/AdminHistorySummary"

    AnalyticsRevenuePoint:
      type: object
      properties:
        date: { type: string }
        revenue: { type: integer }
        orders: { type: integer }
      required: [date, revenue, orders]

    AnalyticsPopularItem:
      type: object
      properties:
        name: { type: string }
        quantity: { type: integer }
        revenue: { type: integer }
      required: [name, quantity, revenue]

    AnalyticsPeakHour:
      type: object
      properties:
        hour: { type: string }
        order_count: { type: integer }
      required: [hour, order_count]

    AnalyticsTablePerformance:
      type: object
      properties:
        table_id: { type: string }
        order_count: { type: integer }
        revenue: { type: integer }
      required: [table_id, order_count, revenue]

    AnalyticsStaffActivity:
      type: object
      properties:
        staff_name: { type: string }
        role: { type: string }
        actions_taken: { type: integer }
      required: [staff_name, role, actions_taken]

    AdminAnalyticsResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            total_revenue: { type: integer }
            total_orders: { type: integer }
            avg_order_value: { type: integer }
          required: [total_revenue, total_orders, avg_order_value]
        revenue_over_time:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsRevenuePoint" }
        popular_items:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsPopularItem" }
        peak_hours:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsPeakHour" }
        table_performance:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsTablePerformance" }
        staff_activity:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsStaffActivity" }
      required: [summary, revenue_over_time, popular_items, peak_hours, table_performance, staff_activity]

    UploadResponse:
      type: object
      properties:
        url: { type: string }

    RegisterDeviceRequest:
      type: object
      properties:
        fcm_token: { type: string }
        restaurant_id: { type: string, format: uuid }
        device_label: { type: string }
      required: [fcm_token, restaurant_id]

    RegisterDeviceResponse:
      type: object
      properties:
        success: { type: boolean, enum: [true] }

    # ---- Identity / Staff (RBAC) ----
    Role:
      type: string
      enum: [OWNER, MANAGER, CASHIER, WAITER, KITCHEN, BARTENDER]

    StaffMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone:
          type: string
          description: >
            Canonical E.164 (+234XXXXXXXXXX) and the account's unique identity.
            Required because not every member of floor staff has an email
            address, and inventing one leaves the account unrecoverable.
        email: { type: string, format: email, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
      required: [id, name, phone, role, created_at]

    AdminLoginRequest:
      type: object
      properties:
        identifier:
          type: string
          description: >
            Phone number or email; the server resolves which by shape. Prefer
            this over `email`, which is kept only as a deprecated alias.
        email:
          type: string
          format: email
          deprecated: true
          description: Deprecated - send `identifier`.
        password: { type: string }
        pin: { type: string }
        restaurant_id:
          type: string
          format: uuid
          description: >
            Scopes a PIN lookup to one restaurant. Without it a PIN matches
            across every tenant, so one merchant's PIN could return a token
            for another's data.

    AdminLoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: "JWT sent as `Authorization: Bearer` on every admin call."
        refresh_token:
          type: string
          description: "Exchanged at `POST /auth/refresh` for a new access token."
        token_type: { type: string, enum: [bearer] }
        expires_in:
          type: integer
          description: Access-token lifetime in seconds (900 = 15 minutes).
          example: 900
        user: { $ref: "#/components/schemas/StaffMember" }
        restaurant: { $ref: "#/components/schemas/Restaurant" }
      required: [access_token, refresh_token, token_type, expires_in, user, restaurant]

    RefreshTokenRequest:
      type: object
      properties:
        refresh_token: { type: string }
      required: [refresh_token]

    RefreshTokenResponse:
      type: object
      description: Returns a new access token only — the refresh token is unchanged.
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [bearer] }
        expires_in: { type: integer, example: 900 }
      required: [access_token, token_type, expires_in]

    AdminMeResponse:
      type: object
      properties:
        restaurant: { $ref: "#/components/schemas/Restaurant" }
        user: { $ref: "#/components/schemas/StaffMember" }
      required: [restaurant, user]

    CreateStaffRequest:
      type: object
      properties:
        name: { type: string }
        phone:
          type: string
          description: >
            Canonical E.164 (+234XXXXXXXXXX) and the account's unique identity.
            Required because not every member of floor staff has an email
            address, and inventing one leaves the account unrecoverable.
        email: { type: string, format: email, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string }
      required: [name, phone, role]

    UpdateStaffRequest:
      type: object
      properties:
        name: { type: string }
        phone: { type: string, description: Canonical E.164. }
        email: { type: string, format: email, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string }

    # ---- Table management ----
    AdminCreateTableRequest:
      type: object
      properties:
        id: { type: string, description: 'Human-facing table label, e.g. "T1".' }
      required: [id]

    AdminCreateTableResponse:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        table_id: { type: string }
      required: [success, table_id]

    AdminDeleteTableResponse:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        table_id: { type: string }
      required: [success, table_id]

    # ---- Inventory ----
    LowStockAlert:
      type: object
      properties:
        item_id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        stock_count: { type: integer }
        threshold: { type: integer }
      required: [item_id, name, category, stock_count, threshold]

    InventoryUpdateRequest:
      type: object
      properties:
        stock_count:
          type: integer
          nullable: true
          description: New stock level, or `null` to disable tracking.
        low_stock_threshold: { type: integer }
      required: [stock_count]

    InventoryUpdateResponse:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        item: { $ref: "#/components/schemas/MenuItem" }
      required: [success, item]

    AdminInventoryAlertsResponse:
      type: object
      properties:
        alerts:
          type: array
          items: { $ref: "#/components/schemas/LowStockAlert" }
      required: [alerts]

    # ---- Multi-branch group ----
    RestaurantBranch:
      allOf:
        - $ref: "#/components/schemas/Restaurant"
        - type: object
          properties:
            is_active: { type: boolean }
            table_count: { type: integer }
            staff_count: { type: integer }
          required: [is_active, table_count, staff_count]

    RestaurantGroup:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        branches:
          type: array
          items: { $ref: "#/components/schemas/RestaurantBranch" }
      required: [id, name, branches]

    GroupBranchAnalytics:
      type: object
      properties:
        branch_id: { type: string }
        branch_name: { type: string }
        total_revenue: { type: integer }
        total_orders: { type: integer }
        avg_order_value: { type: integer }
      required: [branch_id, branch_name, total_revenue, total_orders, avg_order_value]

    GroupAnalyticsResponse:
      type: object
      properties:
        group_name: { type: string }
        total_revenue: { type: integer }
        total_orders: { type: integer }
        branches:
          type: array
          items: { $ref: "#/components/schemas/GroupBranchAnalytics" }
      required: [group_name, total_revenue, total_orders, branches]

    # ---- Platform admin ----
    SubscriptionTier:
      type: string
      enum: [FREE, STARTER, PRO, ENTERPRISE]

    PlatformRestaurant:
      allOf:
        - $ref: "#/components/schemas/Restaurant"
        - type: object
          properties:
            subscription_tier: { $ref: "#/components/schemas/SubscriptionTier" }
            is_active: { type: boolean }
            created_at: { type: string, format: date-time }
            owner_email: { type: string, format: email }
            table_count: { type: integer }
            monthly_orders: { type: integer }
          required: [subscription_tier, is_active, created_at, owner_email, table_count, monthly_orders]

    PlatformRestaurantsResponse:
      type: object
      properties:
        restaurants:
          type: array
          items: { $ref: "#/components/schemas/PlatformRestaurant" }
      required: [restaurants]

    PlatformSystemHealth:
      type: object
      properties:
        api_uptime_pct: { type: number }
        avg_response_ms: { type: number }
        error_rate_pct: { type: number }
        active_sessions: { type: integer }
        total_restaurants: { type: integer }
        total_orders_today: { type: integer }
      required: [api_uptime_pct, avg_response_ms, error_rate_pct, active_sessions, total_restaurants, total_orders_today]

    PlatformCreateRestaurantRequest:
      type: object
      properties:
        name: { type: string }
        owner_name: { type: string }
        owner_phone:
          type: string
          description: Required - the owner is reached here and may have no email.
        owner_email: { type: string, format: email, nullable: true }
        subscription_tier: { $ref: "#/components/schemas/SubscriptionTier" }
        table_count: { type: integer }
        bank_name: { type: string }
        account_number: { type: string }
        account_name: { type: string }
      required: [name, owner_name, owner_email, subscription_tier, table_count]

    PlatformUpdateRestaurantRequest:
      type: object
      properties:
        name: { type: string }
        subscription_tier: { $ref: "#/components/schemas/SubscriptionTier" }
        is_active: { type: boolean }

    Error:
      type: object
      properties:
        error: { type: string }

# =========================================================================
# Paths
# =========================================================================
paths:
  # -----------------------------------------------------------------------
  # CUSTOMER — Menu
  # -----------------------------------------------------------------------
  /menu:
    get:
      tags: [Menu]
      summary: List available menu items
      parameters:
        - name: restaurant_id
          in: query
          schema: { type: string, format: uuid }
          description: Filter by restaurant (optional; returns all if omitted).
      responses:
        "200":
          description: Menu items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MenuItem" }

  # -----------------------------------------------------------------------
  # CUSTOMER — Tables
  # -----------------------------------------------------------------------
  /table/{id}:
    get:
      tags: [Tables]
      summary: Get table info with active orders scoped to device/session
      description: >
        `id` is the table's globally unique uuid, not its name. Table names
        repeat across restaurants, so a name would resolve to whichever table
        the server matched first — potentially another restaurant's, with their
        bank accounts attached. A name is rejected with 422.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The table's uuid, as encoded in its QR code.
        - name: device_token
          in: query
          schema: { type: string }
          description: Anonymous device UUID (sessionStorage per tab).
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
          description: Group session ID if joined.
      responses:
        "200":
          description: Table info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TableInfo" }
        "404":
          description: Table not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /table/{id}/request-pos:
    post:
      tags: [Tables]
      summary: Request a POS terminal at the table
      description: >
        Moves all unpaid (CREATED) orders on this table scoped to the caller's
        device/session into PAYMENT_PENDING, attaches a CLAIMED payment record
        to each (no proof_url; the proof is the in-person card transaction),
        and fires an FCM push with type `pos_requested` so a waiter brings the
        POS terminal. After the customer pays via card, the waiter taps the
        existing "Verify Payment" button on the admin dashboard to mark the
        orders CONFIRMED — same flow as bank-transfer verification.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                  format: uuid
                  description: Group session ID, if joined.
                device_token:
                  type: string
                  description: Anonymous device UUID — used to scope which CREATED orders move to PAYMENT_PENDING.
      responses:
        "200":
          description: POS requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  processed:
                    type: integer
                    description: Number of orders moved to PAYMENT_PENDING.
                required: [success, processed]
        "404":
          description: Table not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /table/{id}/call-waiter:
    post:
      tags: [Tables]
      summary: Summon a waiter to the table
      description: >
        Fires an FCM push to all merchant devices registered for the table's
        restaurant. The customer button is always tappable (no client
        cooldown), so the backend MUST dedupe at the restaurant+table level
        within a short window (e.g. 30s) to avoid spamming staff when a
        customer taps repeatedly or multiple devices on the same table fire
        simultaneously. Always return 200 — the dedupe is silent from the
        caller's perspective.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                  format: uuid
                  description: Group session ID if the caller is in one (for attribution).
      responses:
        "200":
          description: Waiter notified
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                required: [success]
        "404":
          description: Table not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -----------------------------------------------------------------------
  # CUSTOMER — Orders
  # -----------------------------------------------------------------------
  /orders:
    post:
      tags: [Orders]
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "200":
          description: Order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateOrderResponse" }
        "400":
          description: Missing required fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Table is closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get single order detail (with items + payment)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDetail" }
        "404":
          description: Order not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/confirm:
    post:
      tags: [Orders]
      summary: Confirm orders after payment is processed
      description: >
        Marks PAYMENT_PENDING orders as CONFIRMED and updates their payments
        to CONFIRMED. Used client-side after the customer sees the payment
        success screen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmOrdersRequest" }
      responses:
        "200":
          description: Orders confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfirmOrdersResponse" }
        "400":
          description: No confirmable orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -----------------------------------------------------------------------
  # CUSTOMER — Sessions
  # -----------------------------------------------------------------------
  /session:
    post:
      tags: [Sessions]
      summary: Start or join a group ordering session
      description: >
        Use `action=START` to create a new session (generates 4-digit PIN).
        Use `action=JOIN` with a PIN to join an existing active session.
        Optionally pass `unclaimed_order_ids` to migrate pre-session orders
        into the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SessionStartRequest"
                - $ref: "#/components/schemas/SessionJoinRequest"
      responses:
        "200":
          description: Session started or joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400":
          description: Missing fields or invalid action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Invalid PIN or session not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /session/orders:
    get:
      tags: [Sessions]
      summary: List active orders for a session or table
      parameters:
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
        - name: table_id
          in: query
          schema: { type: string }
          description: >
            The table's NAME, not its uuid. A uuid returns 200 with an empty
            list rather than an error, so a mix-up here fails silently.
        - name: device_token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Active orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionOrdersResponse" }

  # -----------------------------------------------------------------------
  # CUSTOMER — Payments
  # -----------------------------------------------------------------------
  /payment/confirm:
    post:
      tags: [Payments]
      summary: Claim payment for one or more orders
      description: >
        Creates/updates payment records to CLAIMED and sets orders to
        PAYMENT_PENDING. This triggers the waiter to verify.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimPaymentRequest" }
      responses:
        "200":
          description: Payment claimed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimPaymentResponse" }
        "400":
          description: Missing order_id or combined_order_ids
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # =========================================================================
  # ADMIN — Identity
  # =========================================================================
  /auth/login:
    post:
      tags: [Admin]
      summary: Authenticate a staff member by email + password
      description: >
        Returns an access token (sent as `Authorization: Bearer` on
        subsequent admin calls), a refresh token, the authenticated `user`
        (with role for RBAC), and the `restaurant` they manage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginRequest" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLoginResponse" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/refresh:
    post:
      tags: [Admin]
      summary: Exchange a refresh token for a new access token
      description: >
        Access tokens last 15 minutes, so expiry during an ordinary shift is
        routine. The shared client calls this automatically on a 401 and retries
        the original request, so staff are only returned to the login screen
        when the refresh token has also expired (7 days).


        Concurrent 401s share a single refresh call — several dashboard queries
        expiring together must not each mint a token and race to store it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshTokenResponse" }
        "401":
          description: Refresh token expired or invalid — the client signs the user out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/me:
    get:
      tags: [Admin]
      summary: Return the restaurant and staff member for the current token
      description: >
        Called by the admin app right after login, and on reload to restore a
        session, to discover which restaurant the caller manages and which staff
        member (and role) they are. The frontend stores `restaurant` in
        sessionStorage and uses `restaurant.id` for FCM device registration, and
        `user.role` to gate RBAC tabs.
      security: [{ adminPin: [] }]
      responses:
        "200":
          description: Restaurant + staff identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMeResponse" }
        "401":
          description: Invalid PIN
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # =========================================================================
  # ADMIN — Staff (RBAC)
  # =========================================================================
  /admin/staff:
    get:
      tags: [Admin]
      summary: List staff members
      security: [{ adminPin: [] }]
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffMember" }
    post:
      tags: [Admin]
      summary: Create a staff member
      security: [{ adminPin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStaffRequest" }
      responses:
        "201":
          description: Created staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "400":
          description: Missing fields or email already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/staff/{id}:
    patch:
      tags: [Admin]
      summary: Update a staff member
      security: [{ adminPin: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStaffRequest" }
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "404":
          description: Staff not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Admin]
      summary: Delete a staff member
      security: [{ adminPin: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
        "400":
          description: Cannot delete the last owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # =========================================================================
  # ADMIN — Settings
  # =========================================================================
  /admin/settings:
    get:
      tags: [Admin]
      summary: Get restaurant settings
      security: [{ adminPin: [] }]
      responses:
        "200":
          description: Settings fetched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restaurant" }
        "401":
          description: Invalid PIN
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    
    patch:
      tags: [Admin]
      summary: Update restaurant settings
      security: [{ adminPin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpdateSettingsRequest" }
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restaurant" }
        "400":
          description: Invalid data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid PIN
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/settings/upload:
    post:
      tags: [Admin]
      summary: Upload a restaurant logo
      security: [{ adminPin: [] }]
      responses:
        "200":
          description: Image uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResponse" }
        "401":
          description: Invalid PIN
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/settings/bank-accounts:
    get:
      tags: [Admin]
      summary: List every payout account, default first
      security: [{ adminPin: [] }]
      responses:
        "200":
          description: Bank accounts, including inactive ones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BankAccount" }
    post:
      tags: [Admin]
      summary: Add a payout account
      description: The first account added is the default, or guests are offered nothing.
      security: [{ adminPin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountRequest" }
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }
        "400":
          description: Missing or invalid fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/settings/bank-accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Admin]
      summary: Update an account, change the default, or hide it from guests
      security: [{ adminPin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountRequest" }
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }
        "404":
          description: Account not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Admin]
      summary: Remove a payout account
      description: >
        Removing the default promotes the best remaining account, so a
        restaurant with any account always has one guests can pay into.
      security: [{ adminPin: [] }]
      responses:
        "200":
          description: Account removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "404":
          description: Account not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/orders/{order_id}/discount:
    post:
      tags: [Admin]
      summary: Discount a bill
      description: >
        Either a flat `amount` in kobo or a `percent` of subtotal. The order is
        **re-priced**, not patched — VAT and service charge are recomputed from
        the discounted subtotal, so the total invariant still holds exactly. A
        discount larger than the subtotal is rejected rather than inverting the
        bill.
      security: [{ adminPin: [] }]
      parameters: [{ name: order_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: integer, description: Flat amount in kobo. }
                percent: { type: number, description: Percentage of subtotal. }
                reason: { type: string }
      responses:
        "200":
          description: Re-priced order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: Discount exceeds the subtotal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/orders/{order_id}/tip:
    post:
      tags: [Admin]
      summary: Add a tip
      description: >
        Added on top of the taxed total — a tip is not a taxable supply, so it
        must not attract VAT or service charge.
      security: [{ adminPin: [] }]
      parameters: [{ name: order_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: integer }
              required: [amount]
      responses:
        "200":
          description: Re-priced order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /admin/orders/{order_id}/refund:
    post:
      tags: [Admin]
      summary: Refund a settled bill
      description: >
        Omitting `amount` refunds the whole order. A refunded order leaves
        `CONFIRMED`, so it stops counting towards the day's takings — otherwise
        the Z-report keeps reporting money that was handed back.
      security: [{ adminPin: [] }]
      parameters: [{ name: order_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: integer }
                reason: { type: string }
      responses:
        "200":
          description: Refund recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  refunded: { type: integer, description: Amount refunded, in kobo. }
        "400":
          description: Order is not CONFIRMED, or the amount exceeds its total
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/orders/{order_id}/items/{item_id}:
    parameters:
      - { name: order_id, in: path, required: true, schema: { type: string } }
      - { name: item_id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Admin]
      summary: Edit a line on the bill
      description: >
        Quantity must be at least 1 — removing a line is a void, which is a
        different intent and a different audit record.
      security: [{ adminPin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer, minimum: 1 }
                price: { type: integer, minimum: 0 }
                name: { type: string }
                notes: { type: string }
      responses:
        "200":
          description: Re-priced order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
    delete:
      tags: [Admin]
      summary: Void a line
      description: Removes it entirely — for something never served.
      security: [{ adminPin: [] }]
      responses:
        "200":
          description: Re-priced order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /admin/orders/{order_id}/items/{item_id}/comp:
    post:
      tags: [Admin]
      summary: Comp a line
      description: >
        Sets the price to zero but keeps the line on the bill — the kitchen made
        it, and the guest should see it was given rather than silently removed.
        That distinction from a void is the whole point.
      security: [{ adminPin: [] }]
      parameters:
        - { name: order_id, in: path, required: true, schema: { type: string } }
        - { name: item_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Re-priced order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /admin/orders/{order_id}/receipt:
    get:
      tags: [Admin]
      summary: Receipt for a settled bill
      description: >
        Composed server-side rather than assembled from the live order: a
        receipt must reflect the sale **as it happened**, so renaming the
        restaurant or changing the VAT rate afterwards must not rewrite a
        receipt already handed to a customer.


        VAT is itemised rather than folded into the total — a customer is
        entitled to see the tax they paid, and a business customer needs it to
        reclaim.
      security: [{ adminPin: [] }]
      parameters: [{ name: order_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id: { type: string, format: uuid }
                  reference: { type: string }
                  table_id: { type: string }
                  customer_name: { type: string, nullable: true }
                  status: { $ref: "#/components/schemas/OrderStatus" }
                  created_at: { type: string, format: date-time }
                  paid_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Null until the bill is settled.
                  restaurant: { $ref: "#/components/schemas/Restaurant" }
                  items:
                    type: array
                    description: Receipt lines carry no id — key on position.
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        quantity: { type: integer }
                        price: { type: integer }
                        notes: { type: string, nullable: true }
                        modifiers:
                          type: array
                          nullable: true
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              option: { type: string }
                              price_delta: { type: integer }
                  subtotal: { type: integer }
                  discount: { type: integer }
                  service_charge: { type: integer }
                  vat: { type: integer }
                  tip: { type: integer }
                  total: { type: integer }
                  payment_method:
                    type: string
                    enum: [CASH, MANUAL_TRANSFER, POS]
                    nullable: true
        "404":
          description: Order not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Who changed what on a bill
      description: >
        Newest first. Written server-side by the actions themselves — a client
        can never author an entry, or the trail would be worth nothing.


        This is what a manager opens when the daily close doesn't reconcile, so
        the actions that move money away from the restaurant (discounts, comps,
        voids, refunds, rejected payments) are the ones worth filtering to.
      security: [{ adminPin: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25 } }
        - name: action
          in: query
          schema: { type: string }
          description: >
            Exact match. Known values: `order.discount`, `order.tip`,
            `order.refund`, `order.cash_paid`, `item.update`, `item.void`,
            `item.comp`. A wrong value returns nothing rather than erroring.
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        created_at: { type: string, format: date-time }
                        action: { type: string }
                        actor_name: { type: string, nullable: true }
                        target_type: { type: string, nullable: true, example: order }
                        target_id: { type: string, nullable: true }
                        details:
                          type: object
                          nullable: true
                          description: >
                            Free-form per action rather than a prepared sentence —
                            typically `amount`, `reason`, `percent`. The wording
                            shown to a user is the client's to compose.
                      required: [id, created_at, action]
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
                required: [logs, total, page, per_page]

  /admin/notifications:
    get:
      tags: [Admin]
      summary: What needs a person, and what was missed
      description: >
        The durable record behind the in-app alert. An alert lives for five
        seconds; this is what a waiter opens to ask what happened while they
        were in the kitchen.


        Only the six event types that are a **request for someone to do
        something** appear here — if nobody would get up, it is not a
        notification. State changes the screens already reflect
        (`order_preparing`, payment outcomes, `table_closed`, session events)
        are deliberately absent.


        **Routing is server-side.** The list returns only what the caller's role
        is entitled to see. A kitchen account must never receive payment
        notifications, because a client that fetches them and hides them has
        still put the day's takings on the pass.


        Distinct from `/admin/audit-logs`, which records what staff *did* for
        accountability. This records what *happened* that someone may need to
        act on. See `docs/notifications.md`.
      security: [{ adminPin: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
        - name: unresolved_only
          in: query
          schema: { type: boolean, default: false }
          description: What the badge counts.
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/NotificationType" }
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  total: { type: integer }
                  unread_total:
                    type: integer
                    description: >
                      Across the whole restaurant, not this page — a badge that
                      changes when someone turns a page is not a badge.
                  unresolved_total:
                    type: integer
                    description: What the bell should display.
                  page: { type: integer }
                  per_page: { type: integer }
                required:
                  [notifications, total, unread_total, unresolved_total, page, per_page]

  /admin/notifications/read:
    post:
      tags: [Admin]
      summary: Mark notifications read for the calling staff member
      description: >
        Read state is **per person**, not per restaurant: it describes one
        member of staff's attention, not whether the work is done. Two waiters
        can both read the same call.


        Idempotent — marking an already-read notification read is a success, not
        a conflict. The client fires this as rows scroll into view and must not
        have to reason about duplicates.
      security: [{ adminPin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
                all:
                  type: boolean
                  description: Marks every notification visible to this caller read.
              description: Supply `ids` or `all`, not both.
      responses:
        "200":
          description: Updated counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_total: { type: integer }
                required: [unread_total]

  /admin/notifications/{id}/resolve:
    post:
      tags: [Admin]
      summary: Claim a notification — "I'll go"
      description: >
        Marks the work as taken, for the whole restaurant, so three waiters do
        not walk to the same table. Sets `resolved_at` and `resolved_by`, and
        publishes `notification_resolved` so a colleague already walking sees it
        go quiet.


        Valid only for `waiter_called` and `pos_requested`. Every other type
        resolves itself from the entity it describes — a `payment_claimed`
        resolves when that payment is verified or rejected — and letting a
        person resolve one by hand would put this list out of step with the
        board. Other types return **409**, not 403: the caller is permitted, the
        action is meaningless.


        Already resolved returns **200** with the existing record rather than an
        error. Two waiters tapping at once is the normal case, and the second
        needs to see who got there first.
      security: [{ adminPin: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The claimed notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "409":
          description: This type resolves itself and cannot be claimed by hand.

  /admin/z-report:
    get:
      tags: [Admin]
      summary: End-of-day close
      description: |
        The figures a manager reconciles against the till before locking up.

        **Settled orders only** — an unpaid bill is not takings.

        Reported as flat figures. Note there is no "sales before adjustments":
        `total_sales` is the headline and the rest describe what made it up, so
        do not present them as an equation resolving to the total.

        `cash_total + transfer_total + pos_total` is what gets checked against
        the drawer.
      security: [{ adminPin: [] }]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Daily close
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  order_count: { type: integer }
                  total_sales: { type: integer, description: What was taken, in kobo. }
                  cash_total: { type: integer }
                  transfer_total: { type: integer }
                  pos_total: { type: integer }
                  vat_collected: { type: integer }
                  service_charge_collected: { type: integer }
                  discount_total: { type: integer }
                  tip_total: { type: integer }
                  refund_total: { type: integer }

  /admin/orders/cash:
    post:
      tags: [Admin]
      summary: Record a cash payment
      description: >
        Settles the given orders outright. Unlike a transfer there is nothing to
        verify afterwards — a staff member is standing at the table with the
        money — so orders go straight to `CONFIRMED` with a `VERIFIED` payment
        recorded against `method: CASH`.


        Cash was previously unrecordable, which meant a restaurant taking cash
        had no way to close a bill in Oshap at all.
      security: [{ adminPin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_ids:
                  type: array
                  items: { type: string, format: uuid }
                amount:
                  type: integer
                  description: Cash tendered, in kobo. Recorded for the drawer.
              required: [order_ids]
      responses:
        "200":
          description: Cash recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  paid: { type: integer, description: Orders settled. }
                  amount: { type: integer, description: Total settled, in kobo. }
        "400":
          description: No orders given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: None of those orders were unpaid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/reject:
    post:
      tags: [Admin]
      summary: Reject a claimed payment
      description: >
        The mirror of `/admin/verify`. Orders return to unpaid (not to the
        kitchen — the food was served), the payment is marked `FAILED`, and the
        account the customer claimed to have paid into has its failure count
        incremented. That counter is what demotes an unreliable account in the
        ranking guests are shown.
      security: [{ adminPin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                table_id: { type: string }
                reason: { type: string }
              required: [table_id]
      responses:
        "200":
          description: Payment rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  rejected: { type: integer }
        "404":
          description: No pending payments on that table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # =========================================================================
  # ADMIN — Tables
  # =========================================================================
  /admin/tables:
    get:
      tags: [Admin]
      summary: List all tables with active order summaries
      security: [{ adminPin: [] }]
      parameters:
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Table status list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTablesResponse" }
        "401":
          description: Invalid PIN
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Admin]
      summary: Create a new table
      security: [{ adminPin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreateTableRequest" }
      responses:
        "201":
          description: Table created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCreateTableResponse" }
        "400":
          description: Table ID is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Table already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/tables/{id}:
    delete:
      tags: [Admin]
      summary: Delete a table
      description: Fails if the table has active orders.
      security: [{ adminPin: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Table deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDeleteTableResponse" }
        "404":
          description: Table not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Cannot delete a table with active orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # =========================================================================
  # ADMIN — Inventory
  # =========================================================================
  /admin/inventory/{id}:
    patch:
      tags: [Inventory]
      summary: Update stock count / low-stock threshold for a menu item
      description: >
        Setting `stock_count` to a positive value re-enables a sold-out item.
        Setting it to `null` disables inventory tracking for the item.
      security: [{ adminPin: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryUpdateRequest" }
      responses:
        "200":
          description: Stock updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryUpdateResponse" }
        "404":
          description: Item not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/inventory/alerts:
    get:
      tags: [Inventory]
      summary: List items at or below their low-stock threshold
      security: [{ adminPin: [] }]
      responses:
        "200":
          description: Low-stock alerts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInventoryAlertsResponse" }

  # =========================================================================
  # ADMIN — Multi-branch group
  # =========================================================================
  /admin/group:
    get:
      tags: [Group]
      summary: Get the restaurant group and its branches
      security: [{ adminPin: [] }]
      responses:
        "200":
          description: Restaurant group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestaurantGroup" }

  /admin/group/analytics:
    get:
      tags: [Group]
      summary: Aggregated revenue/orders across all branches
      security: [{ adminPin: [] }]
      responses:
        "200":
          description: Group analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupAnalyticsResponse" }

  # -----------------------------------------------------------------------
  # ADMIN — Kitchen
  # -----------------------------------------------------------------------
  /admin/kitchen:
    get:
      tags: [Admin]
      summary: List active kitchen orders (CREATED, PREPARING, READY)
      description: >
        Returns all orders in the kitchen pipeline. Frontend buckets them
        into three columns: New (CREATED), Cooking (PREPARING), Ready (READY).
        Orders that have moved past READY (PAYMENT_PENDING, CONFIRMED,
        CANCELLED) are excluded.
      security: [{ adminPin: [] }]
      parameters:
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Kitchen orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderWithItems" }
    patch:
      tags: [Admin]
      summary: Update order status to PREPARING or READY
      security: [{ adminPin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KitchenUpdateRequest" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: Invalid status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -----------------------------------------------------------------------
  # ADMIN — History
  # -----------------------------------------------------------------------
  /admin/history:
    get:
      tags: [Admin]
      summary: Transaction history with pagination and filters
      security: [{ adminPin: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
        - name: table
          in: query
          schema: { type: string }
          description: Filter by table ID (e.g. "T1").
        - name: date
          in: query
          schema: { type: string, format: date }
          description: Filter by date (YYYY-MM-DD).
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Paginated history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminHistoryResponse" }

  # -----------------------------------------------------------------------
  # ADMIN — Analytics
  # -----------------------------------------------------------------------
  /admin/analytics:
    get:
      tags: [Admin]
      summary: Aggregated metrics for dashboard charts
      security: [{ adminPin: [] }]
      parameters:
        - name: start_date
          in: query
          required: true
          schema: { type: string, format: date }
          description: Start date for aggregation (YYYY-MM-DD).
        - name: end_date
          in: query
          required: true
          schema: { type: string, format: date }
          description: End date for aggregation (YYYY-MM-DD).
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAnalyticsResponse" }

  # -----------------------------------------------------------------------
  # ADMIN — Menu Management
  # -----------------------------------------------------------------------
  /admin/menu:
    get:
      tags: [Admin]
      summary: List all menu items (including unavailable)
      security: [{ adminPin: [] }]
      parameters:
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Menu items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MenuItem" }
    post:
      tags: [Admin]
      summary: Create a new menu item
      security: [{ adminPin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMenuItemRequest" }
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItem" }
        "400":
          description: Missing required fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/menu/{id}:
    put:
      tags: [Admin]
      summary: Update a menu item (full update)
      security: [{ adminPin: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMenuItemRequest" }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItem" }
    patch:
      tags: [Admin]
      summary: Toggle menu item availability
      security: [{ adminPin: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                available: { type: boolean }
              required: [available]
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItem" }
    delete:
      tags: [Admin]
      summary: Delete a menu item
      security: [{ adminPin: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }

  /admin/ingredients:
    get:
      tags: [Admin]
      summary: List ingredients
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Ingredients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ingredient"
    post:
      tags: [Admin]
      summary: Create an ingredient
      description: >
        A non-zero stock_qty is recorded as an opening PURCHASE movement, so the
        ledger accounts for every unit rather than starting mid-air.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIngredientRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"

  /admin/ingredients/movements:
    get:
      tags: [Admin]
      summary: Stock movement ledger
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: reason, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 25 } }
      responses:
        "200":
          description: Movements, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementsResponse"

  /admin/ingredients/{ingredient_id}:
    patch:
      tags: [Admin]
      summary: Update an ingredient's details
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ingredient_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIngredientRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"

  /admin/ingredients/{ingredient_id}/adjust:
    post:
      tags: [Admin]
      summary: Move stock by a signed delta
      description: >
        The only way a level changes. Stock is never assigned a value, so the
        ledger can always explain how a level was reached - a stock take is
        therefore also expressed as a delta.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ingredient_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustStockRequest"
      responses:
        "201":
          description: The recorded movement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"

  /admin/menu/{item_id}/recipe:
    get:
      tags: [Admin]
      summary: What one serving of a dish consumes
      security: [{ bearerAuth: [] }]
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Recipe lines with ingredient name and unit resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeResponse"
    put:
      tags: [Admin]
      summary: Replace a dish's recipe
      security: [{ bearerAuth: [] }]
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRecipeRequest"
      responses:
        "200":
          description: The recipe after the write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeResponse"

  /auth/setup/verify:
    post:
      tags: [Auth]
      summary: Check a setup link before showing a form
      description: >
        Unknown, expired and already-used tokens all return 410 with the same
        message. Distinguishing them would let a holder probe which links exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupVerifyRequest"
      responses:
        "200":
          description: Enough to recognise the account, with contact masked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupVerifyResponse"
        "410":
          description: Expired, spent or unknown

  /auth/setup/complete:
    post:
      tags: [Auth]
      summary: Set the owner's password and claim the account
      description: >
        Returns the same shape as POST /auth/login, so the caller signs the
        owner in without a second round-trip. The token is single-use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCompleteRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "410":
          description: Expired, spent or unknown
        "422":
          description: Password fails policy

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a reset link
      description: >
        Always 200, whether or not the identifier matched — a 404 here would
        turn the endpoint into a way to enumerate merchants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Accepted, regardless of whether the account exists

  /admin/modifier-groups:
    get:
      tags: [Admin]
      summary: List the restaurant's modifier groups
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Groups with their options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModifierGroup"
    post:
      tags: [Admin]
      summary: Create a modifier group
      description: Options may be supplied inline; later edits address them individually.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModifierGroupRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModifierGroup"

  /admin/modifier-groups/{group_id}:
    patch:
      tags: [Admin]
      summary: Update a modifier group
      security: [{ bearerAuth: [] }]
      parameters:
        - name: group_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModifierGroupRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModifierGroup"
    delete:
      tags: [Admin]
      summary: Delete a modifier group
      description: Also detaches it from every menu item that referenced it.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: group_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }

  /admin/modifier-groups/{group_id}/options:
    post:
      tags: [Admin]
      summary: Add an option to a group
      security: [{ bearerAuth: [] }]
      parameters:
        - name: group_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModifierOptionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModifierOption"

  /admin/modifier-options/{option_id}:
    patch:
      tags: [Admin]
      summary: Update a modifier option
      description: >
        Setting `available: false` keeps the option visible to guests but
        unselectable — a choice that vanishes reads as an omission rather than
        as something the kitchen has run out of.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: option_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModifierOptionRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModifierOption"
    delete:
      tags: [Admin]
      summary: Delete a modifier option
      security: [{ bearerAuth: [] }]
      parameters:
        - name: option_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }

  /admin/menu/{item_id}/modifier-groups:
    put:
      tags: [Admin]
      summary: Set which modifier groups a dish offers
      description: >
        Replaces the whole attachment set rather than applying a delta, so the
        caller sends every group id it wants to keep.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMenuItemModifierGroupsRequest"
      responses:
        "200":
          description: The item's groups after the write
          content:
            application/json:
              schema:
                type: object
                properties:
                  modifier_groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModifierGroup"

  /admin/menu/export:
    get:
      tags: [Admin]
      summary: Export the menu as CSV
      description: >
        Always populates `external_id`, so the exported file can be edited in a
        spreadsheet and re-imported as updates rather than duplicates.
      security: [{ adminPin: [] }]
      responses:
        "200":
          description: CSV body
          content:
            text/csv:
              schema: { type: string }

  /admin/menu/import:
    post:
      tags: [Admin]
      summary: Bulk create/update menu items from CSV
      description: |
        Columns: `external_id?, name, category, price, description?, available?,
        image_url?, stock_count?, low_stock_threshold?`. Only `name`, `category`
        and `price` are required. `price` is in **kobo**, like every money field.

        **`external_id` is the upsert key.** Present means update that item;
        absent means create. Matching on `name` instead would turn a typo fix
        into a duplicate, which is why export always fills it in.

        Partial success is the normal outcome, not an error: a bad row is
        reported with its row number and the rest still import. Row numbers
        count the header, so they match what the merchant sees in their
        spreadsheet.

        The whole file is validated before any row is written, so a failure at
        row 60 cannot leave a half-imported menu.
      security: [{ adminPin: [] }]
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean }
          description: Validate and report without writing. Used to preview before committing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              required: [file]
      responses:
        "200":
          description: Import result — the same shape for a dry run and a real import
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  updated: { type: integer }
                  skipped: { type: integer }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer, description: 1-indexed, counting the header }
                        field: { type: string }
                        message: { type: string }
                      required: [row, message]
                required: [created, updated, skipped, errors]
        "400":
          description: Missing file, or no rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/menu/upload:
    post:
      tags: [Admin]
      summary: Upload a menu item image
      security: [{ adminPin: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, WebP, or GIF — max 5 MB.
              required: [file]
      responses:
        "200":
          description: Public URL of uploaded image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResponse" }
        "400":
          description: Invalid file type or size
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -----------------------------------------------------------------------
  # ADMIN — Verify / Close
  # -----------------------------------------------------------------------
  /admin/verify:
    post:
      tags: [Admin]
      summary: Verify pending payments for a table
      description: >
        Confirms all PAYMENT_PENDING orders, marks payments as VERIFIED.
        If no unpaid orders remain, sessions are deleted and the table is
        auto-cleaned (auto_closed=true).
      security: [{ adminPin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVerifyRequest" }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVerifyResponse" }
        "404":
          description: No pending payments found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/close:
    post:
      tags: [Admin]
      summary: Close a table (paid or abandoned)
      description: >
        - `paid`: confirms all active orders as revenue, creates VERIFIED payments.
        - `abandoned`: cancels all active orders, resets payments to NOT_PAID.
        In both cases, sessions are deleted.
      security: [{ adminPin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCloseRequest" }
      responses:
        "200":
          description: Table closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCloseResponse" }
        "400":
          description: Missing or invalid reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

